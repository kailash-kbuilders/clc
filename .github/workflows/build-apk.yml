name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate android/ in a throwaway project and copy only that folder in,
      # so flutter create can never overwrite lib/main.dart or pubspec.yaml.
      - name: Generate Android platform files
        run: |
          TMP=$(mktemp -d)
          flutter create "$TMP/seed" --platforms=android --org com.clc --project-name clc_barmer
          cp -r "$TMP/seed/android" ./android
          rm -rf test

      - name: Configure Android (label, permission, desugaring)
        run: python3 .github/scripts/configure_android.py

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk CLC-Barmer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CLC-Barmer-APK
          path: CLC-Barmer.apk

      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CLC Barmer v1.0.${{ github.run_number }}
          files: CLC-Barmer.apk
