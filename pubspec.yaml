name: clc_barmer
description: CLC Barmer - Career Launcher Classes coaching app
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.4
  razorpay_flutter: ^1.4.7
  video_player: ^2.9.2
  youtube_player_flutter: ^10.0.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.3
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/banners/
    - assets/courses/
    - assets/video/
    - assets/paper/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
